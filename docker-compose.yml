# Local development services. Production uses managed equivalents.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ajh
      POSTGRES_PASSWORD: ajh_local_dev
      POSTGRES_DB: ajh
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajh -d ajh"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for resume files and exports (SeaweedFS;
  # the MinIO image is no longer published on Docker Hub)
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches magic-link emails locally: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  s3data:
